# Configuration for Hugo Blox Portfolio
baseURL: 'https://kbhalajiyadav.github.io'
title: 'Bhalaji Yadav'
theme: 'hugo-blox-builder'

# Language settings
defaultContentLanguage: 'en'
hasCJKLanguage: false
defaultContentLanguageInSubdir: false

# Pagination
paginate: 10
paginatePath: '/page/'

# Output formats
outputs:
  home: [HTML, RSS, JSON, WebAppManifest, headers, redirects]
  section: [HTML, RSS]

# Imaging settings
imaging:
  quality: 75
  resampleFilter: lanczos
  anchor: smart

# Taxonomies
taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types
  author: authors

# Related content
related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70

# Security
security:
  funcs:
    getenv:
      - ^HUGO_
      - ^WC_

# Markup settings
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    noClasses: false
    style: 'monokai'
    tabWidth: 4

# Module settings
module:
  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-bootstrap/v5
  mounts:
    - source: assets
      target: assets
    - source: static
      target: static
    - source: content
      target: content
