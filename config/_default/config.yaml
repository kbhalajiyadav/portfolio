# Configuration for the public research portfolio
baseURL: "https://bhalaji.com/"
title: "Bhalaji Yadav Kantepalle"

# Hugo Blox module
module:
  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-bootstrap/v5

# Language settings
defaultContentLanguage: 'en'
hasCJKLanguage: false
defaultContentLanguageInSubdir: false

# Pagination
paginate: 10
paginatePath: '/page/'

# Output formats
outputs:
  home: [HTML, RSS, JSON, WebAppManifest, headers, redirects]
  section: [HTML, RSS]

# Imaging settings
imaging:
  quality: 75
  resampleFilter: lanczos
  anchor: smart

# Taxonomies
taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types
  author: authors

# Related content
related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70

# Security
security:
  funcs:
    getenv:
      - ^HUGO_
      - ^WC_

# Markup settings
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    noClasses: false
    style: 'monokai'
    tabWidth: 4

# Search discovery
sitemap:
  changefreq: monthly
  priority: 0.6
  filename: sitemap.xml
