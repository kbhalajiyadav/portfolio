research:
  - number: "01"
    title: Soft-interface mechanics
    text: Mechanics-consistent peel analysis for compliant, stretchable, and textile-supported interfaces.
    tags: [Adhesion, Fracture, Wearables]
    href: publication/adhesives-wearable/
    link_label: Read the published study
  - number: "02"
    title: Computer-vision metrology
    text: Image-processing workflows that synchronize deformation, color, and mechanical measurements.
    tags: [OpenCV, CIE L*a*b*, Reproducibility]
    href: "#workflow"
    link_label: See the evidence workflow
  - number: "03"
    title: Structure under flow
    text: Rheology and neutron-scattering methods for resolving structure-processing-property relationships in liquid crystals.
    tags: [Rheology, SANS, Liquid crystals]
    href: "#trajectory"
    link_label: Follow the research trajectory
  - number: "04"
    title: Reproducible research software
    text: Versioned, citable analysis tools that turn experimental traces into transparent engineering decisions.
    tags: [Python, Open methods, Zenodo]
    href: project/peel-trace-evaluation/
    link_label: Explore the software

milestones:
  - period: August 2026
    label: Academic transition
    title: Complete the M.S. and begin doctoral training
    text: >-
      Complete the M.S. in Chemical and Life Science Engineering, transition
      from Graduate Research Assistant to Graduate Teaching Assistant, and
      begin the Integrative Life Sciences Ph.D.
  - period: Fall 2026
    label: Characterization
    title: Neutron scattering and rheology
    text: >-
      Use scattering and flow-aware characterization to connect processing
      history with liquid-crystal organization and measurable material response.
  - period: 2026–2027
    label: Translation
    title: Temperature mapping and functional use cases
    text: >-
      Advance passive thermochromic temperature-mapping concepts, including
      preventive diabetic foot-care, while identifying useful applications
      across wearable, sensing, and soft-material domains.

workflow:
  - number: "01"
    title: Frame the physical question
    text: Define the mechanism, comparison, and decision before collecting measurements.
    href: "#research"
    link_label: Research questions
  - number: "02"
    title: Acquire synchronized evidence
    text: Pair mechanics with optical, deformation, or structural measurements.
    href: publication/adhesives-wearable/
    link_label: Published example
  - number: "03"
    title: Quantify reproducibly
    text: Use protocol-defined signal processing, computer vision, and uncertainty-aware comparisons.
    href: project/peel-trace-evaluation/
    link_label: Open analysis
  - number: "04"
    title: Publish the decision trail
    text: Connect methods, software, and peer-reviewed outputs so conclusions can be inspected and reused.
    href: "#outputs"
    link_label: Research outputs

