research:
  - number: "01"
    title: Soft-interface mechanics
    text: Mechanics-consistent peel analysis for compliant, stretchable, and textile-supported interfaces.
    tags: [Adhesion, Fracture, Wearables]
  - number: "02"
    title: Computer-vision metrology
    text: Image-processing workflows that synchronize deformation, color, and mechanical measurements.
    tags: [OpenCV, CIE L*a*b*, Reproducibility]
  - number: "03"
    title: Structure under flow
    text: Rheology and neutron-scattering approaches for linking processing, structure, and material response.
    tags: [Rheology, SANS, Liquid crystals]
  - number: "04"
    title: Autonomous experimentation
    text: An emerging direction in closed-loop experiments using robotic handling, sensing, and quantitative analysis.
    tags: [xArm6, Automation, Experiment design]

