collaboration_questions:
- title: Structure under processing
  text: How do thermal and flow histories organize liquid-crystal structure across relevant time and length
    scales?
- title: Structure to measurable response
  text: How can neutron scattering, rheology, optical metrology, and mechanics reveal structure-processing-property
    relationships?
- title: Materials to use cases
  text: How can passive thermochromic and soft-material systems be translated into reliable temperature-mapping,
    wearable, and sensing applications?
narrative:
  problem_title: The response is only useful when its meaning survives processing.
  problem: Stimuli-responsive materials already change color, stiffness, or organization. The unresolved
    problem is that the response can drift when the material is reshaped, scaled, or processed on different
    equipment. That makes reliable translation a processing and metrology problem before it is only a
    chemistry problem.
  chain:
  - Stimulus
  - Structure
  - Response
  - Measurement
  - Translation
  chain_note: Controlled deformation, temperature, and flow are connected to evolving structure, measurable
    optical and mechanical response, and processing conditions that can be reproduced.
applications:
- Passive temperature mapping and battery-free wearable indicators
- Non-contact and non-destructive optical interrogation
- Visual safety and inspection indicators readable without instruments
- Adaptive, decorative, and interactive surfaces
- Low-power sensing in remote or hard-to-reach environments
doctoral:
  title: Structure under processing is the doctoral center of gravity.
  text: My doctoral research examines how deformation, temperature, and flow reorganize stimuli-responsive
    liquid crystals over time; how those structural changes generate optical, thermal, and mechanical
    response; and how reproducible measurements can guide reliable devices and scalable processing.
  robotics: Time-resolved studies require stimulus cycles that repeat identically. Robotic handling, for
    example with a UFACTORY xArm6, could provide consistent sample placement, controlled loading and thermal
    cycles, and image capture synchronized to the mechanical record. Combined with OpenCV, this can support
    time-resolved and eventually closed-loop experiments. Robotics is the infrastructure; the scientific
    claim remains the stimulus–structure–response relationship.
