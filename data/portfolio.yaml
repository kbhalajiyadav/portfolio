collaboration_questions:
- title: Processing history and molecular order
  text: How do heating, cooling, and shear alter cholesteric orientation, structural transitions, and recovery?
    When does helical order persist, reorient, or unwind?
- title: Structure and trustworthy measurement
  text: Which combinations of rheology, scattering, and optical measurements can distinguish structural
    changes from hysteresis, experimental drift, and competing interpretations?
- title: Calibrating response across thermal cycles
  text: How consistently can temperature-dependent optical responses be calibrated over repeated heating
    and cooling cycles, and what limits their use as quantitative thermal indicators?
narrative:
  problem_title: Three approaches to measuring material response.
  problem: Mechanical, optical, and structural methods provide different kinds of evidence. Combining
    them helps reveal what a material does and what a measurement can establish.
  chain:
  - Stimulus
  - Structure
  - Response
  - Measurement
  - Translation
  chain_note: Processing history can change internal order and material properties. Measurements test
    how structure relates to optical, mechanical, or other functional responses and whether the result repeats.
applications:
- Characterization of responsive materials under controlled thermal and flow histories
- Comparing structure and measured response across other process-sensitive soft materials, with material-specific validation
- Calibration and repeatability testing for passive thermal indicators and soft wearable interfaces
doctoral:
  title: Liquid crystals as a model system for how processing shapes structure.
  text: Rheology and quantitative imaging provide complementary measurements, while scattering can
    help test competing interpretations of structural change.
  robotics: Controlled heating, cooling, and shear histories can help distinguish reversible response
    from hysteresis, structural recovery, and measurement drift. I am interested in synchronizing
    experimental conditions with optical, mechanical, and structural measurements to test repeatability
    across stimulus cycles.
