collaboration_questions:
- title: Processing history and molecular order
  text: How do heating, cooling, and shear alter cholesteric orientation, structural transitions, and recovery?
    When does helical order persist, reorient, or unwind?
- title: Structure and trustworthy measurement
  text: Which combinations of rheology, scattering, and optical measurements can distinguish structural
    changes from hysteresis, experimental drift, and competing interpretations?
- title: Calibrating response across thermal cycles
  text: How consistently can temperature-dependent optical responses be calibrated over repeated heating
    and cooling cycles, and what limits their use as quantitative thermal indicators?
narrative:
  problem_title: From stimulus to structure to measurement.
  problem: Responsive materials can change color, stiffness, or organization. The harder question is whether
    that change can still be interpreted after reshaping, scaling, or moving between processing conditions.
  chain:
  - Stimulus
  - Structure
  - Response
  - Measurement
  - Translation
  chain_note: Temperature, deformation, and flow alter structure; measurements connect those changes to
    optical and mechanical behavior and to the conditions that produced them.
applications:
- Characterization of thermochromic and other responsive materials under controlled thermal histories
- Passive thermal indicators and wearable interfaces, subject to device-specific validation
- Exploratory infrared-thermography analysis software, separate from material-based color sensing
doctoral:
  title: My doctoral work asks how processing history organizes liquid-crystal structure.
  text: Small-molecule cholesteric mixtures provide a model system for investigating how temperature
    and flow shape molecular order and measurable response. I bring together rheology, structure-sensitive
    characterization, and quantitative optical methods; the broader aim is reproducible measurement
    across responsive soft materials.
  robotics: Controlled heating, cooling, and shear histories can help distinguish reversible response
    from hysteresis, structural recovery, and measurement drift. I am interested in synchronizing
    experimental conditions with optical, mechanical, and structural measurements to test repeatability
    across stimulus cycles.
