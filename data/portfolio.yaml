  eyebrow: Stimuli-responsive materials · Quantitative metrology · Structure under flow
  headline: A material that changes color is easy to make. One you can read as a measurement is not.
  summary: I study stimuli-responsive soft and liquid-crystalline materials, connecting deformation, temperature,
    and flow history to the structure that forms, the optical and mechanical response that follows, and
    the processing conditions under which that response can be reproduced.
