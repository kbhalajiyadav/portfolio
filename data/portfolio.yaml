collaboration_questions:
  - title: Structure under processing
    text: >-
      How do thermal and flow histories organize liquid-crystal structure
      across relevant time and length scales?
  - title: Structure to measurable response
    text: >-
      How can neutron scattering, rheology, optical metrology, and mechanics
      reveal structure-processing-property relationships?
  - title: Materials to use cases
    text: >-
      How can passive thermochromic and soft-material systems be translated
      into reliable temperature-mapping, wearable, and sensing applications?
