  bullets:
  - Developed mechanics-consistent adhesion and fracture-characterization methods for soft, stretchable,
    and textile-supported interfaces.
  - Engineered reproducible Python and OpenCV workflows that synchronized force-displacement data, deformation
    tracking, and optical colorimetry.
  - Guided two Summer 2026 student research projects in liquid-crystal temperature mapping and hyperspectral
    detection of plastics in soil mixtures; provided Spring 2026 technical support in NMR characterization,
    strain-to-color analysis, scientific figures, posters, and grant drafting.
  - Contributed technical writing and regulatory analysis to a phased $100,000 Commonwealth Cyber Initiative
    proposal; the $30,000 prototype and proof-of-concept phase was initially funded, with later funding
    contingent on satisfactory progress.
