  - Mentored two students in Summer 2026 on characterization planning, NMR-related interpretation, strain-to-color
    quantification, relationship plots, scientific figures, and poster development.
  - Contributed technical writing and regulatory analysis to a phased $100,000 Commonwealth Cyber Initiative
    proposal; the $30,000 prototype and proof-of-concept phase was initially funded, with later funding
    contingent on satisfactory progress.
