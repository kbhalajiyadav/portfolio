name: Verify live favicon

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-live-favicon.yaml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect production favicon surfaces
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base="https://bhalaji.com"
          mkdir -p evidence

          curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache, no-store, max-age=0' \
            --header 'Pragma: no-cache' \
            "${base}/?favicon-verify=${stamp}" -D evidence/home.headers -o evidence/home.html

          echo '--- Production icon declarations ---'
          grep -Eio '<link[^>]+rel="[^"]*(icon|manifest)[^"]*"[^>]*>' evidence/home.html || true
          echo '--- Production title marker ---'
          grep -Eo '<title>[^<]+' evidence/home.html | head -1 || true

          check_url() {
            local path="$1"
            local name="$2"
            local url="${base}${path}"
            local status
            status=$(curl --silent --show-error --location \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              --output "evidence/${name}.body" \
              --dump-header "evidence/${name}.headers" \
              --write-out '%{http_code}' \
              "${url}?favicon-verify=${stamp}" || true)
            echo "--- ${path} ---"
            echo "status=${status}"
            grep -Ei '^(content-type|content-length|cache-control|etag|last-modified|age|server|x-cache):' "evidence/${name}.headers" || true
            echo "sha256=$(sha256sum "evidence/${name}.body" | cut -d' ' -f1)"
            echo "bytes=$(wc -c < "evidence/${name}.body")"
            file "evidence/${name}.body" || true
            printf '%s' "${status}" > "evidence/${name}.status"
          }

          check_url '/media/bk-favicon-20260729-3.ico' 'versioned-ico'
          check_url '/favicon.ico' 'root-ico'
          check_url '/favicon.svg' 'favicon-svg'
          check_url '/apple-touch-icon.png' 'apple-touch'
          check_url '/media/bk-monogram-192.png' 'manifest-192'
          check_url '/media/bk-monogram-512.png' 'manifest-512'
          check_url '/site.webmanifest' 'manifest'

          echo '--- Manifest icon entries ---'
          cat evidence/manifest.body

          grep -Fq '/media/bk-favicon-20260729-3.ico' evidence/home.html
          test "$(cat evidence/versioned-ico.status)" = '200'
          file evidence/versioned-ico.body | grep -Eiq 'icon|MS Windows'
          test "$(cat evidence/favicon-svg.status)" = '200'
          grep -aq '>BK<' evidence/favicon-svg.body
          test "$(cat evidence/apple-touch.status)" = '200'
          file evidence/apple-touch.body | grep -qi 'PNG image data'
          test "$(cat evidence/manifest-192.status)" = '200'
          test "$(cat evidence/manifest-512.status)" = '200'
          grep -Fq '/media/bk-monogram-192.png?v=20260729-2' evidence/manifest.body
          grep -Fq '/media/bk-monogram-512.png?v=20260729-2' evidence/manifest.body
