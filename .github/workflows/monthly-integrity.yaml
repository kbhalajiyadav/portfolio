name: Monthly portfolio integrity audit

on:
  schedule:
    - cron: "23 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly-integrity
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUGO_VERSION: 0.124.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Hugo CLI
        run: |
          package="hugo_${HUGO_VERSION}_linux-amd64.deb"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${package}" "${release}/${package}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/checksums.txt" "${release}/hugo_${HUGO_VERSION}_checksums.txt"
          (cd "${RUNNER_TEMP}" && grep " ${package}$" checksums.txt | sha256sum --check --strict)
          sudo dpkg -i "${RUNNER_TEMP}/${package}"

      - name: Install audit dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Check source and cross-source consistency
        run: |
          mkdir -p artifacts
          date -u +"checked_at=%Y-%m-%dT%H:%M:%SZ" | tee artifacts/integrity-check.txt
          python3 scripts/audit_source.py
          python3 scripts/audit_templates.py
          python3 scripts/check_workflows.py
          python3 scripts/check_data_consistency.py
          python3 scripts/check_review_freshness.py

      - name: Reconcile against current ORCID
        run: |
          python3 scripts/sync_orcid.py --output artifacts/orcid-current.json
          python3 scripts/check_data_consistency.py --orcid-snapshot artifacts/orcid-current.json

      - name: Check research software release drift
        run: python3 scripts/check_software_release.py

      - name: Build and check links
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --gc --minify --printPathWarnings --baseURL "https://bhalaji.com/"
          python3 scripts/check_site.py public
          python3 scripts/check_external_links.py public --site-origin https://bhalaji.com/ --report artifacts/external-links.json

      - name: Check current live site
        run: python3 scripts/check_live_site.py "https://bhalaji.com/" --attempts 3 --delay 5

      - name: Upload integrity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monthly-integrity-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
