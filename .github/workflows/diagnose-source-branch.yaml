name: Diagnose source audits on refinement branch

on:
  push:
    branches: [agent/final-content-internal-pages]
    paths-ignore:
      - audit-diagnostics.txt

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install audit dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Capture each audit result
        run: |
          set +e
          : > audit-diagnostics.txt
          for command in \
            "python3 scripts/build_cv.py --no-compile" \
            "git diff --exit-code -- cv/generated/bhalaji_cv.tex" \
            "python3 scripts/audit_source.py" \
            "python3 scripts/audit_styles.py" \
            "python3 scripts/audit_templates.py" \
            "python3 scripts/check_workflows.py" \
            "node --check static/js/site.js"; do
            printf '\n$ %s\n' "$command" >> audit-diagnostics.txt
            bash -lc "$command" >> audit-diagnostics.txt 2>&1
            printf 'EXIT=%s\n' "$?" >> audit-diagnostics.txt
          done
      - name: Commit diagnostic report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-diagnostics.txt
          git commit -m "Capture source audit diagnostics"
          git push
