name: Regenerate CV on refinement branch

on:
  push:
    branches: [agent/final-content-internal-pages]
    paths:
      - data/cv.yaml
      - scripts/build_cv.py
      - cv/generated/bhalaji_cv.tex
      - .github/workflows/regenerate-cv-branch.yaml

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install proven CV dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex poppler-utils
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Build and verify phone-free CV
        run: |
          python3 scripts/build_cv.py
          test "$(pdfinfo static/uploads/resume.pdf | awk '/^Pages:/ {print $2}')" = "2"
          test "$(pdfinfo static/uploads/resume.pdf | awk '/^Page size:/ {print $3, $5}')" = "612 792"
          ! pdftotext static/uploads/resume.pdf - | grep -E '804[ )-]*310[ -]*4169|\+1[ (]*804'

      - name: Commit generated CV assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cv/generated/bhalaji_cv.tex static/uploads/resume.pdf
          if git diff --cached --quiet; then
            echo "Generated CV assets are already current."
            exit 0
          fi
          git commit -m "Regenerate phone-free August 2026 CV"
          git push
