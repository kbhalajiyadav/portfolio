name: Diagnose generated-site audit on refinement branch

on:
  push:
    branches: [agent/final-content-internal-pages]
    paths-ignore:
      - generated-site-diagnostics.txt

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUGO_VERSION: 0.124.1
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install verified Hugo CLI
        run: |
          package="hugo_${HUGO_VERSION}_linux-amd64.deb"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${package}" "${release}/${package}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/checksums.txt" "${release}/hugo_${HUGO_VERSION}_checksums.txt"
          (cd "${RUNNER_TEMP}" && grep " ${package}$" checksums.txt | sha256sum --check --strict)
          sudo dpkg -i "${RUNNER_TEMP}/${package}"
      - name: Capture generated-site audit
        run: |
          set +e
          hugo --gc --minify --printPathWarnings --baseURL https://bhalaji.com/ >/tmp/hugo.log 2>&1
          python3 scripts/check_site.py public > generated-site-diagnostics.txt 2>&1
          printf '\nEXIT=%s\n' "$?" >> generated-site-diagnostics.txt
      - name: Commit diagnostic report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add generated-site-diagnostics.txt
          git commit -m "Capture generated-site audit diagnostic"
          git push
