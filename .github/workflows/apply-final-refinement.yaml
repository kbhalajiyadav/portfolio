name: Apply approved final portfolio refinement

on:
  push:
    branches:
      - agent/final-portfolio-refinement

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install validation dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Apply approved refinement
        run: python3 scripts/apply_final_refinement.py
      - name: Validate source before commit
        run: |
          python3 scripts/build_cv.py --no-compile
          python3 scripts/audit_source.py
          python3 scripts/audit_styles.py
          python3 scripts/audit_templates.py
          python3 scripts/check_workflows.py
          node --check assets/js/site.js
      - name: Commit final refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize portfolio content and interface refinement"
          git push
