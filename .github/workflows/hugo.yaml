name: Build and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HUGO_VERSION: 0.124.1
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install verified Hugo CLI
        run: |
          package="hugo_${HUGO_VERSION}_linux-amd64.deb"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${package}" "${release}/${package}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/checksums.txt" "${release}/hugo_${HUGO_VERSION}_checksums.txt"
          (cd "${RUNNER_TEMP}" && grep " ${package}$" checksums.txt | sha256sum --check --strict)
          sudo dpkg -i "${RUNNER_TEMP}/${package}"
          hugo version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install exact audit-tool versions
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Python audit dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3 websocket-client==1.9.0

      - name: Build canonical browser icons
        run: |
          if ! command -v rsvg-convert >/dev/null 2>&1 || ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick librsvg2-bin
          fi
          bash scripts/build_browser_icons.sh

      - name: Audit source, visual system, workflows, templates, and JavaScript
        run: |
          python3 scripts/build_cv.py --no-compile
          git diff --exit-code -- cv/generated/bhalaji_cv.tex
          python3 scripts/audit_source.py
          python3 scripts/audit_styles.py
          python3 scripts/audit_templates.py
          python3 scripts/check_workflows.py
          node --check assets/js/site.js

      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build production site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          BASE_URL="https://bhalaji.com/"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            BASE_URL="${{ steps.pages.outputs.base_url }}/"
          fi
          rm -rf public artifacts .lighthouseci
          mkdir -p artifacts
          hugo --gc --minify --printPathWarnings --baseURL "${BASE_URL}"

      - name: Audit generated site and external records
        run: |
          python3 scripts/check_site.py public
          python3 scripts/check_external_links.py public --site-origin https://bhalaji.com/ --report artifacts/external-links.json

      - name: Start rendered-site test server
        run: |
          python3 -u -m http.server 4173 --bind 127.0.0.1 --directory public > artifacts/server.log 2>&1 &
          echo $! > artifacts/server.pid
          for attempt in {1..20}; do
            curl --silent --fail http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat artifacts/server.log
          exit 1

      - name: Resolve Chrome executable
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"

      - name: Accessibility audit at desktop and mobile widths
        run: |
          set -o pipefail
          PA11Y_WIDTH=1440 PA11Y_HEIGHT=1000 npx pa11y-ci --config .pa11yci.cjs --json | tee artifacts/pa11y-desktop.json
          PA11Y_WIDTH=390 PA11Y_HEIGHT=844 npx pa11y-ci --config .pa11yci.cjs --json | tee artifacts/pa11y-mobile.json

      - name: Responsive, laptop-frame, zoom-equivalent, reduced-motion, and menu audit
        run: |
          python3 scripts/check_responsive.py \
            --base-url http://127.0.0.1:4173/ \
            --chrome "$CHROME_PATH" \
            --report artifacts/responsive-layout.json \
            --screenshots artifacts/responsive-screenshots
          python3 scripts/check_laptop_landing.py \
            --base-url http://127.0.0.1:4173/ \
            --chrome "$CHROME_PATH" \
            --report artifacts/laptop-landing.json \
            --screenshot artifacts/responsive-screenshots/1366x768-laptop-home.png

      - name: Lighthouse audits for mobile and desktop
        run: |
          LHCI_FORM_FACTOR=mobile npx lhci autorun --config=.lighthouserc.cjs
          rm -rf .lighthouseci
          LHCI_FORM_FACTOR=desktop npx lhci autorun --config=.lighthouserc.cjs

      - name: Report generated-site inventory
        if: always()
        run: |
          if [[ -d public ]]; then
            echo "HTML pages: $(find public -type f -name '*.html' | wc -l)"
            echo "Largest generated assets:"
            find public -type f -printf '%s %p\n' | sort -nr | head -20
          fi

      - name: Upload successful pre-deployment evidence
        if: github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-predeployment-evidence-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-build-diagnostics-${{ github.run_attempt }}
          path: |
            artifacts/
            public/
            .lighthouseci/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Checkout deployment checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify deployed release
        run: python3 scripts/check_live_site.py "${{ steps.deployment.outputs.page_url }}"

      - name: Notify IndexNow
        continue-on-error: true
        run: python3 scripts/submit_indexnow.py
