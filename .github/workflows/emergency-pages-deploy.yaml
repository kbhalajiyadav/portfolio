name: Emergency Pages deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-pages-deploy.yaml
      - .github/deploy-trigger.txt
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: emergency-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      issue_number: ${{ steps.issue.outputs.number }}
    steps:
      - name: Record observable deployment run
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(cat <<EOF
          Emergency GitHub Pages deployment started.

          - Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Commit: ${GITHUB_SHA}
          - Expected live marker: A material that changes color is easy to make.
          EOF
          )
          number=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" \
            -f title="Emergency Pages deployment ${GITHUB_RUN_ID}" \
            -f body="$body" \
            --jq '.number')
          echo "number=${number}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: announce
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      HUGO_VERSION: 0.124.1
    steps:
      - name: Checkout validated source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install verified Hugo CLI
        run: |
          package="hugo_${HUGO_VERSION}_linux-amd64.deb"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${package}" "${release}/${package}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/checksums.txt" "${release}/hugo_${HUGO_VERSION}_checksums.txt"
          (cd "${RUNNER_TEMP}" && grep " ${package}$" checksums.txt | sha256sum --check --strict)
          sudo dpkg -i "${RUNNER_TEMP}/${package}"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build finalized portfolio
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          rm -rf public
          hugo --gc --minify --printPathWarnings --baseURL "${{ steps.pages.outputs.base_url }}/"
          grep -F "A material that changes color is easy to make" public/index.html
          grep -F "Graduate Researcher · Quantitative Metrology" public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

      - name: Deploy finalized portfolio
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify published release
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          for attempt in {1..18}; do
            page=$(curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "${base}?release=${GITHUB_SHA}-${attempt}" || true)
            if grep -Fq "A material that changes color is easy to make" <<<"${page}" \
              && grep -Fq "Ph.D. student" <<<"${page}"; then
              echo "Verified finalized portfolio at ${base}"
              exit 0
            fi
            sleep 10
          done
          echo "Published release did not expose the finalized markers." >&2
          exit 1

  finalize:
    if: always()
    needs: [announce, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Record deployment result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.announce.outputs.issue_number }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [[ -z "${ISSUE_NUMBER}" ]]; then
            echo "No issue number was produced."
            exit 0
          fi
          if [[ "${DEPLOY_RESULT}" == "success" ]]; then
            gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --body "Deployment succeeded and the finalized live markers were verified."
            gh issue close "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --reason completed
          else
            gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --body "Deployment failed or was blocked. Inspect: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
