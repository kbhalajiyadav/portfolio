name: Validate generated CV

on:
  push:
    branches: [main]
    paths:
      - data/cv.yaml
      - cv/**
      - scripts/build_cv.py
      - .github/workflows/cv-validation.yaml
      - .github/workflows/hugo.yaml
  pull_request:
    branches: [main]
    paths:
      - data/cv.yaml
      - cv/**
      - scripts/build_cv.py
      - .github/workflows/cv-validation.yaml
      - .github/workflows/hugo.yaml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install proven CV dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex poppler-utils
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Verify required LaTeX packages
        run: |
          for package in enumitem.sty titlesec.sty fancyhdr.sty microtype.sty lastpage.sty; do
            kpsewhich "$package" >/dev/null || {
              echo "Missing required LaTeX package: $package" >&2
              exit 1
            }
          done

      - name: Regenerate and preflight CV and resume
        run: |
          python3 scripts/build_cv.py
          pdfinfo static/uploads/cv.pdf | tee cv-pdfinfo.txt
          pdfinfo static/uploads/resume.pdf | tee resume-pdfinfo.txt
          test "$(pdfinfo static/uploads/cv.pdf | awk '/^Pages:/ {print $2}')" = "3"
          test "$(pdfinfo static/uploads/resume.pdf | awk '/^Pages:/ {print $2}')" = "2"
          test "$(pdfinfo static/uploads/cv.pdf | awk '/^Page size:/ {print $3, $5}')" = "612 792"
          test "$(pdfinfo static/uploads/resume.pdf | awk '/^Page size:/ {print $3, $5}')" = "612 792"
          pdftotext -layout static/uploads/cv.pdf generated-cv.txt
          pdftotext -layout static/uploads/resume.pdf generated-resume.txt
          grep -F "INTELLECTUAL PROPERTY" generated-cv.txt >/dev/null
          grep -F "Quantitative Thermal Imaging" generated-cv.txt >/dev/null
          grep -F "TAN-26-099" generated-cv.txt >/dev/null
          grep -F "INDUSTRY EXPERIENCE" generated-resume.txt >/dev/null
          grep -F "Kreative Organics" generated-resume.txt >/dev/null

      - name: Upload CV diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cv-validation-diagnostics-${{ github.run_attempt }}
          path: |
            cv/generated/
            static/uploads/cv.pdf
            static/uploads/resume.pdf
            cv-pdfinfo.txt
            resume-pdfinfo.txt
            generated-cv.txt
            generated-resume.txt
          if-no-files-found: warn
          retention-days: 14
