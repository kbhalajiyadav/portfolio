name: Validate generated CV

on:
  push:
    branches: [main]
    paths:
      - data/cv.yaml
      - cv/**
      - scripts/build_cv.py
      - static/uploads/resume.pdf
      - .github/workflows/cv-validation.yaml
  pull_request:
    branches: [main]
    paths:
      - data/cv.yaml
      - cv/**
      - scripts/build_cv.py
      - static/uploads/resume.pdf
      - .github/workflows/cv-validation.yaml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install CV dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-xetex poppler-utils
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Preserve committed outputs
        run: |
          cp cv/generated/bhalaji_cv.tex "${RUNNER_TEMP}/committed.tex"
          cp static/uploads/resume.pdf "${RUNNER_TEMP}/committed.pdf"

      - name: Regenerate and preflight CV
        run: |
          python3 scripts/build_cv.py
          cmp --silent "${RUNNER_TEMP}/committed.tex" cv/generated/bhalaji_cv.tex
          cmp --silent "${RUNNER_TEMP}/committed.pdf" static/uploads/resume.pdf
          pdfinfo static/uploads/resume.pdf | tee cv-pdfinfo.txt
          test "$(pdfinfo static/uploads/resume.pdf | awk '/^Pages:/ {print $2}')" = "2"

      - name: Upload CV diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cv-validation-diagnostics-${{ github.run_attempt }}
          path: |
            cv/generated/bhalaji_cv.tex
            static/uploads/resume.pdf
            cv-pdfinfo.txt
          retention-days: 14
