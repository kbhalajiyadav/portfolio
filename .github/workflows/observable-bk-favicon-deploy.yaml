name: Observable BK favicon deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/observable-bk-favicon-deploy.yaml
      - .github/bk-favicon-deploy-trigger.txt
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: observable-bk-favicon-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      issue_number: ${{ steps.issue.outputs.number }}
    steps:
      - name: Record deployment run
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(cat <<EOF
          Production BK favicon deployment started.

          - Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Commit: ${GITHUB_SHA}
          - Required live icon: /media/bk-favicon-20260729-3.ico
          EOF
          )
          number=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" \
            -f title="BK favicon deployment ${GITHUB_RUN_ID}" \
            -f body="$body" \
            --jq '.number')
          echo "number=${number}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: announce
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      HUGO_VERSION: 0.124.1
    steps:
      - name: Checkout validated source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install verified Hugo CLI
        run: |
          package="hugo_${HUGO_VERSION}_linux-amd64.deb"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${package}" "${release}/${package}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/checksums.txt" "${release}/hugo_${HUGO_VERSION}_checksums.txt"
          (cd "${RUNNER_TEMP}" && grep " ${package}$" checksums.txt | sha256sum --check --strict)
          sudo dpkg -i "${RUNNER_TEMP}/${package}"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build current portfolio
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          rm -rf public
          hugo --gc --minify --printPathWarnings --baseURL "${{ steps.pages.outputs.base_url }}/"
          grep -F '/media/bk-favicon-20260729-3.ico' public/index.html
          test -s public/media/bk-favicon-20260729-3.ico
          test -s public/apple-touch-icon.png
          test -s public/media/bk-monogram-192.png
          test -s public/media/bk-monogram-512.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

      - name: Deploy current portfolio
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify production domain
        run: |
          base="https://bhalaji.com"
          for attempt in {1..30}; do
            stamp="${GITHUB_SHA}-${attempt}"
            page=$(curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              "${base}/?bk-favicon-release=${stamp}" || true)
            status=$(curl --silent --show-error --location \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --output "${RUNNER_TEMP}/bk-favicon.ico" \
              --write-out '%{http_code}' \
              "${base}/media/bk-favicon-20260729-3.ico?release=${stamp}" || true)
            touch_status=$(curl --silent --show-error --location \
              --output "${RUNNER_TEMP}/apple-touch.png" \
              --write-out '%{http_code}' \
              "${base}/apple-touch-icon.png?release=${stamp}" || true)
            if grep -Fq '/media/bk-favicon-20260729-3.ico' <<<"${page}" \
              && [[ "${status}" == "200" ]] \
              && [[ "${touch_status}" == "200" ]] \
              && file "${RUNNER_TEMP}/bk-favicon.ico" | grep -Eiq 'icon|MS Windows' \
              && file "${RUNNER_TEMP}/apple-touch.png" | grep -qi 'PNG image data'; then
              echo "Verified live BK favicon release at ${base}"
              exit 0
            fi
            echo "Attempt ${attempt}: html_marker=$([[ "${page}" == *'/media/bk-favicon-20260729-3.ico'* ]] && echo yes || echo no) ico=${status} touch=${touch_status}"
            sleep 10
          done
          echo "Production domain did not expose the BK favicon release." >&2
          exit 1

  finalize:
    if: always()
    needs: [announce, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Record deployment result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.announce.outputs.issue_number }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [[ -z "${ISSUE_NUMBER}" ]]; then
            exit 0
          fi
          if [[ "${DEPLOY_RESULT}" == "success" ]]; then
            gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --body "Deployment succeeded. The production HTML, versioned BK ICO, and Apple touch icon were verified."
            gh issue close "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --reason completed
          else
            gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --body "Deployment or production verification failed. Inspect https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
