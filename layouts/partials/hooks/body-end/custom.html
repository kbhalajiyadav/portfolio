<script>
/* 1) Set CSS variable to the real navbar height */
(function () {
  function setNavHeightVar() {
    const nav = document.querySelector('#navbar-main, .navbar');
    if (!nav) return;
    const h = Math.ceil(nav.getBoundingClientRect().height);
    document.documentElement.style.setProperty('--nav-h', h + 'px');
  }
  window.addEventListener('resize', setNavHeightVar);
  document.addEventListener('DOMContentLoaded', setNavHeightVar);
  setNavHeightVar();
})();
</script>

<script>
/* 2) Reading progress bar */
(function () {
  function updateProgress() {
    const bar = document.getElementById('reading-progress');
    if (!bar) return;

    const doc = document.documentElement;
    const scrollTop = doc.scrollTop || document.body.scrollTop;
    const scrollHeight = doc.scrollHeight || document.body.scrollHeight;
    const clientHeight = doc.clientHeight || window.innerHeight;

    const total = Math.max(scrollHeight - clientHeight, 1);
    const progress = Math.min(Math.max(scrollTop / total, 0), 1);

    bar.style.width = (progress * 100).toFixed(2) + '%';
  }

  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', updateProgress);
  document.addEventListener('DOMContentLoaded', updateProgress);
  updateProgress();
})();
</script>
