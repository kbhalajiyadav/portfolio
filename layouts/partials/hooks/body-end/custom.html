<style>
  /* --- 1. HEADER FIX --- */
  .navbar {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    z-index: 1020 !important;
    background-color: #ffffff !important; 
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  /* --- 2. BODY PADDING (FIX FOR BLOCKED TITLE) --- */
  /* We increased this from 80px to 100px to give the title more room */
  body {
    padding-top: 100px !important; 
  }

  /* Extra push for the Main Article Container */
  /* This specifically targets the "Mechanics..." title area */
  .article-container {
    padding-top: 30px !important; 
  }

  /* --- 3. WIDTH FIX (FIX FOR "ELONGATED" LOOK) --- */
  /* This ensures the text column doesn't stretch too wide */
  .col-lg-9, .col-md-8 {
    padding-right: 50px !important; 
  }
  
  /* --- 4. SIDEBAR FIX --- */
  .aside-column {
    position: -webkit-sticky !important;
    position: sticky !important;
    top: 110px !important; /* Adjusted to match new body padding */
    height: calc(100vh - 110px) !important;
    overflow-y: auto !important;
    align-self: flex-start !important;
  }
  
  /* Fix alignment */
  .row { align-items: flex-start !important; }

  /* --- 5. READING PROGRESS BAR --- */
  #reading-progress {
    position: fixed;
    top: 70px; /* Sits right below the standard header */
    left: 0;
    width: 0%;
    height: 4px;
    background: #1565c0; /* Blue Color */
    z-index: 1021; 
    transition: width 0.1s ease-out;
  }
</style>

<div id="reading-progress"></div>

<script>
  window.addEventListener('scroll', () => {
    const totalHeight = document.body.scrollHeight - window.innerHeight;
    const progress = (window.scrollY / totalHeight) * 100;
    const progressBar = document.getElementById('reading-progress');
    
    if (progressBar) {
        progressBar.style.width = progress + '%';
    }
  });
</script>
