<script>
(function () {
  function getNavbarHeight() {
    const nav = document.querySelector('#navbar-main, .navbar');
    if (!nav) return 70;
    return Math.ceil(nav.getBoundingClientRect().height);
  }

  function setNavHeightVar() {
    document.documentElement.style.setProperty('--nav-h', getNavbarHeight() + 'px');
  }

  // Progress bar update
  function updateProgress() {
    const bar = document.getElementById('reading-progress');
    if (!bar) return;

    const doc = document.documentElement;
    const scrollTop = doc.scrollTop || document.body.scrollTop;
    const scrollHeight = doc.scrollHeight || document.body.scrollHeight;
    const clientHeight = doc.clientHeight || window.innerHeight;

    const total = Math.max(scrollHeight - clientHeight, 1);
    const progress = Math.min(Math.max(scrollTop / total, 0), 1);

    bar.style.width = (progress * 100).toFixed(2) + '%';
  }

  // ✅ Scrollspy for ALL TOCs (desktop + mobile)
  function initTOCSpy() {
    const tocs = Array.from(document.querySelectorAll('.toc-sidebar #TableOfContents'));
    if (!tocs.length) return;

    // collect ALL toc links from ALL toc containers
    const allLinks = [];
    tocs.forEach(toc => {
      toc.querySelectorAll('a[href^="#"]').forEach(a => allLinks.push(a));
    });
    if (!allLinks.length) return;

    // map heading -> all matching TOC links (desktop + mobile)
    const headingToLinks = new Map();
    allLinks.forEach(a => {
      const id = decodeURIComponent(a.getAttribute('href').slice(1));
      const el = document.getElementById(id);
      if (!el) return;
      if (!headingToLinks.has(el)) headingToLinks.set(el, []);
      headingToLinks.get(el).push(a);
    });

    function clearActive() {
      allLinks.forEach(a => a.classList.remove('active-toc-link'));
    }

    const navH = getNavbarHeight();

    const observer = new IntersectionObserver((entries) => {
      const visible = entries
        .filter(e => e.isIntersecting)
        .sort((a,b) => b.boundingClientRect.top - a.boundingClientRect.top)[0];

      if (!visible) return;

      clearActive();
      const links = headingToLinks.get(visible.target) || [];
      links.forEach(a => a.classList.add('active-toc-link'));

    }, {
      root: null,
      // account for fixed header so headings don’t count as “hidden under navbar”
      rootMargin: `-${navH + 10}px 0px -70% 0px`,
      threshold: 0.01
    });

    headingToLinks.forEach((links, heading) => observer.observe(heading));
  }

  // Run
  function initAll() {
    setNavHeightVar();
    updateProgress();
    initTOCSpy();
  }

  window.addEventListener('resize', () => {
    setNavHeightVar();
    updateProgress();
  });

  window.addEventListener('scroll', updateProgress, { passive: true });

  document.addEventListener('DOMContentLoaded', initAll);
  initAll();
})();
</script>


<script>
(function () {
  // ... your existing code ...

  function rerenderMermaidAfterFonts() {
    if (!window.mermaid) return;
    const nodes = document.querySelectorAll('.mermaid');
    if (!nodes.length) return;

    // Wait for fonts, then re-run Mermaid so node widths match final font metrics
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        try {
          // Mermaid v10+ supports run(); older supports init()
          if (typeof mermaid.run === 'function') {
            mermaid.run({ nodes });
          } else if (typeof mermaid.init === 'function') {
            mermaid.init(undefined, nodes);
          }
        } catch (e) {
          console.warn("Mermaid rerender failed:", e);
        }
      });
    }
  }

  // call once now, and also after resize (TOC/sidebar changes column width)
  rerenderMermaidAfterFonts();
  window.addEventListener('resize', () => {
    clearTimeout(window.__mermaidResizeTimer);
    window.__mermaidResizeTimer = setTimeout(rerenderMermaidAfterFonts, 200);
  });

})();
</script>
