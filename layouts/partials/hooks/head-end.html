<style>
  /* 0. CRITICAL FIX: Disable theme animations that break sticky/fixed positioning */
  body, .page-wrapper, .article-container, .hero-lead {
    transform: none !important;
    -webkit-transform: none !important;
    animation: none !important;
    opacity: 1 !important;
  }

  /* 1. FIXED HEADER (Works on all pages now) */
  #navbar-main, .navbar {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    z-index: 99999 !important; /* Maximum Priority */
    background-color: #ffffff !important; 
    box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
  }

  /* 2. BODY PADDING (Push content down on all pages) */
  body {
    padding-top: 80px !important; 
  }

  /* 3. STICKY SIDEBAR + VERTICAL LINE (Only applies to Project Pages) */
  .aside-column {
    position: -webkit-sticky !important;
    position: sticky !important;
    top: 90px !important;       
    height: calc(100vh - 90px) !important;
    overflow-y: auto !important; 
    align-self: flex-start !important;
    border-left: 2px solid #e0e0e0 !important; 
    padding-left: 20px !important;
    background-color: #fff !important;
  }

  /* Ensure column alignment */
  .row { align-items: flex-start !important; }
  
  /* Prevent Main Content from touching the line */
  .col-lg-9, .col-md-8 { padding-right: 30px !important; }

  /* 4. READING PROGRESS BAR STYLE (CSS) */
  #reading-progress {
    position: fixed; top: 70px; left: 0; width: 0%; height: 4px; background: #1565c0; z-index: 1021; transition: width 0.1s ease-out;
  }

  /* 5. TAGS & TOC Styles */
  .article-container { padding-top: 1.5rem !important; }
  .toc-sidebar, .tags-sidebar { margin-top: 1.5rem !important; }
  .tags-sidebar { padding-top: 1rem; border-top: 1px solid var(--border-color); }
  .toc-sidebar h3, .tags-sidebar h3 { font-size: 0.9rem; font-weight: bold; text-transform: uppercase; margin-bottom: 0.5rem; }
  .tags-sidebar .badge { display: inline-block; padding: 0.35em 0.6em; font-size: 75%; font-weight: 700; line-height: 1; text-align: center; white-space: nowrap; vertical-align: baseline; border-radius: 0.25rem; margin: 0.2rem 0.2rem 0.2rem 0; background-color: #f8f9fa; color: #000; border: 1px solid #dee2e6; }

</style>

<!-- Reading Progress Bar HTML Element -->
<div id="reading-progress"></div>

<script>
  // Script for the progress bar
  window.addEventListener('scroll', () => {
    const totalHeight = document.body.scrollHeight - window.innerHeight;
    const progress = (window.scrollY / totalHeight) * 100;
    const progressBar = document.getElementById('reading-progress');
    if (progressBar) {
        progressBar.style.width = progress + '%';
    }
  });
</script>
