<style>
  /* --- 1. HEADER FIX (STICKY TOP) --- */
  .navbar {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    z-index: 1020 !important;
    background-color: #ffffff !important;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  /* --- 2. BODY PADDING --- */
  body {
    padding-top: 75px !important;
  }

  /* --- 3. FIXED SIDEBAR + VERTICAL BAR --- */
  .aside-column {
    position: fixed !important;
    top: 90px !important;
    right: 0 !important;
    width: 25% !important; /* Adjust if needed */
    height: calc(100vh - 90px) !important;
    overflow-y: auto !important;
    padding-left: 20px !important;
    
    /* THE VERTICAL BAR SEPARATOR */
    border-left: 2px solid #e0e0e0 !important;
    background-color: #fff !important;
  }

  /* Adjust Main Content to not touch the sidebar */
  .col-lg-9, .col-md-8 {
      padding-right: 30px !important; 
  }

  /* --- 4. ACTIVE TOC HIGHLIGHTING (NEW) --- */
  /* Default State for Links */
  .toc-sidebar a {
      display: block;
      color: #666; /* Grey by default */
      text-decoration: none;
      padding: 2px 0;
      transition: all 0.2s ease;
      border-left: 3px solid transparent; /* Invisible border to prevent jumping */
      padding-left: 8px;
  }

  /* Active State (When you are reading this section) */
  .toc-sidebar a.active-toc-link {
      color: #1565c0 !important; /* Blue text */
      font-weight: bold !important;
      border-left: 3px solid #1565c0 !important; /* Blue left marker */
      background-color: #f0f7ff; /* Very faint blue background */
  }

  /* --- 5. SIDEBAR GENERAL STYLING --- */
  .toc-sidebar, .tags-sidebar { margin-top: 1.5rem !important; }
  
  .toc-sidebar h3, .tags-sidebar h3 {
    font-size: 0.9rem !important;
    font-weight: bold !important;
    text-transform: uppercase !important;
    margin-bottom: 0.5rem !important;
  }
  
  /* Tag Cloud Styling */
  .tags-sidebar { padding-top: 1rem; border-top: 1px solid var(--border-color); }
  .tags-sidebar .badge { 
      display: inline-block; padding: 0.35em 0.6em; font-size: 75%; 
      font-weight: 700; line-height: 1; text-align: center; white-space: nowrap; 
      vertical-align: baseline; border-radius: 0.25rem; 
      margin: 0.2rem 0.2rem 0.2rem 0; background-color: #f8f9fa; 
      color: #000; border: 1px solid #dee2e6; 
  }

  /* --- 6. READING PROGRESS BAR --- */
  #reading-progress {
    position: fixed;
    top: 74px; /* Just under the navbar */
    left: 0;
    width: 0%;
    height: 4px;
    background: #1565c0; 
    z-index: 1021; 
    transition: width 0.1s ease-out;
  }
</style>

<div id="reading-progress"></div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    
    // --- PART A: Reading Progress Bar Logic ---
    window.addEventListener('scroll', () => {
      const totalHeight = document.body.scrollHeight - window.innerHeight;
      const progress = (window.scrollY / totalHeight) * 100;
      const progressBar = document.getElementById('reading-progress');
      if (progressBar) progressBar.style.width = progress + '%';
    });

    // --- PART B: Table of Contents Highlighter (ScrollSpy) ---
    const headers = document.querySelectorAll('.article-container h1, .article-container h2, .article-container h3');
    const tocLinks = document.querySelectorAll('.toc-sidebar a');

    window.addEventListener('scroll', () => {
      let currentId = '';

      // Find which header is currently nearest to the top of the screen
      headers.forEach(header => {
        const headerTop = header.offsetTop;
        if (window.scrollY >= (headerTop - 150)) { // 150px offset for the sticky header
          currentId = header.getAttribute('id');
        }
      });

      // Loop through TOC links and add/remove 'active-toc-link' class
      tocLinks.forEach(link => {
        link.classList.remove('active-toc-link');
        if (link.getAttribute('href') === '#' + currentId) {
          link.classList.add('active-toc-link');
        }
      });
    });
    
  });
</script>
