<style>
  /* --- 1. FIXED HEADER (Blue Bar) --- */
  .navbar {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    z-index: 1020 !important;
    background-color: #ffffff !important; /* White Background */
    box-shadow: 0 2px 5px rgba(0,0,0,0.1); /* Subtle shadow */
  }

  /* --- 2. BODY PADDING (Prevents content from hiding behind header) --- */
  body {
    padding-top: 80px !important; 
  }

  /* --- 3. STICKY SIDEBAR + VERTICAL LINE --- */
  /* This keeps the sidebar locked in place while you scroll */
  .aside-column {
    position: -webkit-sticky !important;
    position: sticky !important;
    top: 90px !important;        /* Distance from top header */
    height: calc(100vh - 90px) !important;
    overflow-y: auto !important; /* Allows scrolling inside sidebar if needed */
    align-self: flex-start !important;
    
    /* The Grey Divider Line */
    border-left: 2px solid #e0e0e0 !important; 
    padding-left: 20px !important;
    background-color: #fff !important;
  }

  /* Adjust Main Content so it doesn't touch the line */
  .col-lg-9, .col-md-8 {
      padding-right: 30px !important; 
  }
  
  /* Ensure alignment */
  .row { align-items: flex-start !important; }

  /* --- 4. TABLE OF CONTENTS HIGHLIGHTING (ScrollSpy) --- */
  /* Normal Link */
  .toc-sidebar a {
      display: block;
      color: #666; 
      text-decoration: none;
      padding: 4px 0;
      transition: all 0.2s ease;
      border-left: 3px solid transparent; 
      padding-left: 10px;
      font-size: 0.85rem;
  }

  /* Active/Highlighted Link */
  .toc-sidebar a.active-toc-link {
      color: #1565c0 !important;       /* Blue Text */
      font-weight: bold !important;
      border-left: 3px solid #1565c0 !important; /* Blue Line Marker */
      background-color: #f0f7ff;       /* Light Blue Background */
  }

  /* --- 5. GENERAL STYLES (Tags & Titles) --- */
  .toc-sidebar, .tags-sidebar { margin-top: 1.5rem !important; }
  
  .toc-sidebar h3, .tags-sidebar h3 {
    font-size: 0.9rem !important;
    font-weight: bold !important;
    text-transform: uppercase !important;
    margin-bottom: 0.5rem !important;
  }
  
  /* Tag Bubbles */
  .tags-sidebar { padding-top: 1rem; border-top: 1px solid #eee; }
  .tags-sidebar .badge { 
      display: inline-block; padding: 0.35em 0.6em; font-size: 75%; 
      font-weight: 700; line-height: 1; text-align: center; 
      white-space: nowrap; vertical-align: baseline; 
      border-radius: 0.25rem; margin: 0.2rem; 
      background-color: #f8f9fa; color: #000; border: 1px solid #dee2e6; 
  }

  /* --- 6. READING PROGRESS BAR (Blue Top Line) --- */
  #reading-progress {
    position: fixed;
    top: 70px; /* Aligns perfectly with bottom of navbar */
    left: 0;
    width: 0%;
    height: 4px;
    background: #1565c0; 
    z-index: 1021; 
    transition: width 0.1s ease-out;
  }
</style>

<div id="reading-progress"></div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    
    // --- 1. Reading Progress Bar Logic ---
    window.addEventListener('scroll', () => {
      const totalHeight = document.body.scrollHeight - window.innerHeight;
      const progress = (window.scrollY / totalHeight) * 100;
      const progressBar = document.getElementById('reading-progress');
      if (progressBar) progressBar.style.width = progress + '%';
    });

    // --- 2. ScrollSpy (TOC Highlighter) Logic ---
    const headers = document.querySelectorAll('.article-container h1, .article-container h2, .article-container h3');
    const tocLinks = document.querySelectorAll('.toc-sidebar a');

    if (headers.length > 0 && tocLinks.length > 0) {
      window.addEventListener('scroll', () => {
        let currentId = '';

        // Find the header currently in view
        headers.forEach(header => {
          const headerTop = header.offsetTop;
          if (window.scrollY >= (headerTop - 200)) { // Offset for header height
            currentId = header.getAttribute('id');
          }
        });

        // Highlight the matching link in TOC
        tocLinks.forEach(link => {
          link.classList.remove('active-toc-link');
          // Match the href (e.g., "#intro") with the ID
          if (link.getAttribute('href') === '#' + currentId) {
            link.classList.add('active-toc-link');
          }
        });
      });
    }
  });
</script>
