<style>
  /* 1. HEADER FIX: Forces the navbar to stay at the top */
  .navbar {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    z-index: 1020 !important;
    background-color: #ffffff !important; 
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  /* 2. BODY PADDING: Pushes content down so it's not hidden behind the header */
  body {
    padding-top: 80px !important; 
  }

  /* 3. SIDEBAR FIX: Keeps the Table of Contents visible while scrolling */
  .row { align-items: flex-start !important; }
  
  .aside-column {
    position: -webkit-sticky !important;
    position: sticky !important;
    top: 90px !important; /* Aligns below the fixed header */
    height: calc(100vh - 90px) !important;
    overflow-y: auto !important;
    align-self: flex-start !important;
  }
  
  /* Fix sidebar alignment */
  .article-container { padding-top: 1.5rem !important; }
  .toc-sidebar, .tags-sidebar { margin-top: 1.5rem !important; }

  /* 4. READING PROGRESS BAR STYLE (CSS only) */
  #reading-progress {
    position: fixed;
    top: 70px; /* Position under navbar */
    left: 0;
    width: 0%;
    height: 4px;
    background: #1565c0; 
    z-index: 1021; 
    transition: width 0.1s ease-out;
  }
  
  /* 5. TAGS Styles (Moved from custom.css) */
  .tags-sidebar { padding-top: 1rem; border-top: 1px solid var(--border-color); }
  .tags-sidebar h3 { font-size: 0.9rem; font-weight: bold; text-transform: uppercase; margin-bottom: 0.5rem; }
  .tags-sidebar .badge { display: inline-block; padding: 0.35em 0.6em; font-size: 75%; font-weight: 700; line-height: 1; text-align: center; white-space: nowrap; vertical-align: baseline; border-radius: 0.25rem; margin: 0.2rem 0.2rem 0.2rem 0; background-color: #f8f9fa; color: #000; border: 1px solid #dee2e6; }
</style>
