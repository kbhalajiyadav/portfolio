<style>
  /* 1. HEADER FIX: Forces the navbar to stay at the top */
  .navbar {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    z-index: 1020 !important;
    
    /* FORCE OPAQUE BACKGROUND (White) */
    /* If you want blue, change #ffffff to #0d47a1 */
    background-color: #ffffff !important; 
    
    /* Optional: Adds a small shadow so you can see where the header ends */
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  /* 2. BODY PADDING: Pushes content down so it's not hidden behind the header */
  body {
    padding-top: 80px !important; /* Increased slightly to be safe */
  }

  /* 3. SIDEBAR FIX: Keeps the Table of Contents visible while scrolling */
  .aside-column {
    position: -webkit-sticky !important;
    position: sticky !important;
    top: 90px !important; /* Aligns below the fixed header */
    height: calc(100vh - 90px) !important;
    overflow-y: auto !important;
    align-self: flex-start !important;
  }
  
  /* Fix sidebar alignment */
  .row { align-items: flex-start !important; }
  .article-container { padding-top: 1.5rem !important; }
  .toc-sidebar, .tags-sidebar { margin-top: 1.5rem !important; }

  /* 4. READING PROGRESS BAR */
  #reading-progress {
    position: fixed;
    top: 70px; /* Adjust this to match your navbar height */
    left: 0;
    width: 0%;
    height: 4px;
    background: #1565c0; 
    z-index: 1021; 
    transition: width 0.1s ease-out;
  }
</style>

<div id="reading-progress"></div>
<script>
  window.addEventListener('scroll', () => {
    const totalHeight = document.body.scrollHeight - window.innerHeight;
    const progress = (window.scrollY / totalHeight) * 100;
    const progressBar = document.getElementById('reading-progress');
    if (progressBar) {
        progressBar.style.width = progress + '%';
    }
  });
</script>
