<link rel="stylesheet" href="/css/custom.css">

<div id="reading-progress"></div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    
    // 1. Progress Bar
    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY;
      const docHeight = document.body.scrollHeight - window.innerHeight;
      const scrollPercent = (scrollTop / docHeight) * 100;
      const progressBar = document.getElementById('reading-progress');
      if (progressBar) progressBar.style.width = scrollPercent + '%';
    });

    // 2. ScrollSpy (Active TOC)
    const headers = document.querySelectorAll('.article-container h1, .article-container h2, .article-container h3');
    const tocLinks = document.querySelectorAll('.toc-sidebar a');

    if (headers.length > 0 && tocLinks.length > 0) {
      window.addEventListener('scroll', () => {
        let currentId = '';
        headers.forEach(header => {
          if (window.scrollY >= (header.offsetTop - 150)) {
            currentId = header.getAttribute('id');
          }
        });
        tocLinks.forEach(link => {
          link.classList.remove('active-toc-link');
          if (link.getAttribute('href') === '#' + currentId) {
            link.classList.add('active-toc-link');
          }
        });
      });
    }
  });
</script>
