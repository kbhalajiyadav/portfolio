{{/* Reusable research figure. Context: dict "figure" (src, width, height, evidence, alt, caption, credit, license, license_url) plus optional "source", "data", "code" links. */}}
{{ $f := .figure }}
<figure class="research-figure">
  <a class="research-figure__media" href="{{ $f.src | relURL }}" target="_blank" rel="noopener"><img src="{{ $f.src | relURL }}" alt="{{ $f.alt }}" width="{{ $f.width }}" height="{{ $f.height }}" loading="lazy" decoding="async"></a>
  <figcaption>
    <span class="research-figure__evidence">{{ $f.evidence }}</span>
    <p>{{ $f.caption }}</p>
    <small>{{ $f.credit }} Reused under <a href="{{ $f.license_url }}" target="_blank" rel="noopener license">{{ $f.license }}</a>.</small>
    {{ if or .source .data .code }}<div class="actions">{{ with .source }}<a class="lnk" href="{{ . }}" target="_blank" rel="noopener">Article <span class="arw" aria-hidden="true">↗</span></a>{{ end }}{{ with .data }}<a class="lnk" href="{{ . }}" target="_blank" rel="noopener">Dataset <span class="arw" aria-hidden="true">↗</span></a>{{ end }}{{ with .code }}<a class="lnk" href="{{ . }}" target="_blank" rel="noopener">Source code <span class="arw" aria-hidden="true">↗</span></a>{{ end }}</div>{{ end }}
  </figcaption>
</figure>
