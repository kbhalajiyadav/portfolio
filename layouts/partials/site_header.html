{{ $p := site.Data.portfolio }}
{{ $root := "/" | relURL }}
<header class="site-head">
  <div class="site-head__inner">
    <a class="brand h-card u-url" href="{{ $root }}" rel="me" aria-label="{{ $p.profile.name }}, portfolio home">
      <span class="brand__monogram" aria-hidden="true">BK</span>
      <span><strong class="p-name">{{ $p.profile.short_name }}</strong><small class="p-note">Research portfolio</small></span>
      <img class="u-photo indieweb-photo" src="{{ "uploads/avatar-portrait.jpg" | relURL }}" alt="Portrait of {{ $p.profile.name }}" width="853" height="1056" aria-hidden="true">
    </a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
      <a href="{{ $root }}#research">Research</a>
      <a href="{{ $root }}#outputs">Outputs</a>
      <a href="{{ $root }}#experience">Experience</a>
      <a href="{{ $root }}#presentations">Presentations</a>
      <a href="{{ $root }}#trajectory">Trajectory</a>
      <a class="nav-contact" href="mailto:{{ $p.profile.email }}">Contact</a>
    </nav>
  </div>
</header>
