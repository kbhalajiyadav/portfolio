<section class="privacy-banner" data-privacy-banner aria-label="Analytics privacy choices">
  <div class="privacy-banner__copy">
    <strong>Analytics privacy</strong>
    <p>Microsoft Clarity loads only with your permission. Advertising storage remains disabled. <a href="{{ "privacy/" | relURL }}">Privacy notice</a>.</p>
  </div>
  <div class="privacy-banner__actions">
    <button class="button button--primary" type="button" data-consent-allow>Allow analytics</button>
    <button class="button privacy-banner__decline" type="button" data-consent-decline>Decline</button>
  </div>
</section>
