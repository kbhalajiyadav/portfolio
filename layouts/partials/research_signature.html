{{ $p := site.Data.portfolio }}
<figure class="research-signature" aria-labelledby="research-signature-caption">
  <ol class="research-signature__flow" aria-label="Stimulus to translation research framework">
    {{ range $index, $step := $p.narrative.chain }}
    <li><span class="research-signature__index">{{ printf "%02d" (add $index 1) }}</span><strong>{{ $step }}</strong></li>
    {{ end }}
  </ol>
  <figcaption id="research-signature-caption">{{ $p.narrative.chain_note }}</figcaption>
</figure>
