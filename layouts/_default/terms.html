{{ define "main" }}
<section class="list-page page-shell">
  <header class="page-header">
    <p class="kicker">Research index</p>
    <h1>{{ .Title }}</h1>
    <p class="page-lede">Browse public research records by topic.</p>
  </header>
  <div class="listing-grid">
    {{ range .Data.Terms.Alphabetical }}
    <article>
      <span class="overline">{{ .Count }} {{ if eq .Count 1 }}record{{ else }}records{{ end }}</span>
      <h2><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a></h2>
      <a class="lnk" href="{{ .Page.RelPermalink }}">View topic <span class="arw" aria-hidden="true">↗</span></a>
    </article>
    {{ end }}
  </div>
</section>
{{ end }}
