<style>
  /* 0. CRITICAL FIX: Ensure styles load and animations don't conflict */
  body, .page-wrapper, .article-container, main, #navbar-main {
    transform: none !important;
    -webkit-transform: none !important;
    animation: none !important;
    opacity: 1 !important;
    min-height: auto !important; /* Ensure min-height doesn't block sticky/fixed */
  }

  /* 1. THE "HARD PUSH" (CRITICAL FIX FOR CONTENT) */
  /* This guarantees the content starts far enough down the page */
  .page-wrapper {
    padding-top: 120px !important; 
    margin-top: 0 !important;
  }
  html { scroll-padding-top: 120px !important; }

  /* 2. FIXED HEADER (Guaranteed Fixed) */
  #navbar-main, .navbar {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    z-index: 999999 !important; /* Maximum Priority */
    background-color: #ffffff !important; 
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    min-height: 70px !important; 
  }

  /* 3. WIDTH & ALIGNMENT FIX */
  .col-lg-9, .col-md-8 { padding-right: 50px !important; }
  .row { align-items: flex-start !important; }

  /* 4. FIXED SIDEBAR */
  .aside-column {
    position: -webkit-sticky !important;
    position: sticky !important;
    top: 130px !important; /* Adjusted to align below fixed header/padding */
    height: calc(100vh - 130px) !important;
    overflow-y: auto !important;
    align-self: flex-start !important;
    border-left: 2px solid #e0e0e0 !important;
    padding-left: 20px !important;
    background-color: #ffffff !important;
  }

  /* 5. READING PROGRESS BAR & TOC Styles */
  #reading-progress { position: fixed; top: 70px; left: 0; width: 0%; height: 4px; background: #1565c0; z-index: 100000; transition: width 0.1s linear; }
  .toc-sidebar, .tags-sidebar { margin-top: 1.5rem !important; }
  .toc-sidebar a, .tags-sidebar a { /* Styles for your links */ transition: all 0.2s ease; }
  .toc-sidebar a.active-toc-link { color: #1565c0 !important; font-weight: bold !important; border-left: 3px solid #1565c0 !important; background-color: #f0f7ff; }

</style>

<!-- Reading Progress Bar HTML/JS (loads instantly in head) -->
<div id="reading-progress"></div>
<script>
  window.addEventListener('scroll', () => {
    const totalHeight = document.body.scrollHeight - window.innerHeight;
    const progress = (window.scrollY / totalHeight) * 100;
    const progressBar = document.getElementById('reading-progress');
    if (progressBar) { progressBar.style.width = progress + '%'; }
  });
</script>
