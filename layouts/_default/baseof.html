<!doctype html>
<html lang="{{ site.Language.Lang | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f5f0">
  {{ partial "seo_head.html" . }}
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
</head>
<body class="page-{{ .Kind }} section-{{ .Section }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  {{ partial "site_header.html" . }}
  <main id="main-content">{{ block "main" . }}{{ end }}</main>
  {{ partial "site_footer.html" . }}
  <script src="{{ "js/site.js" | relURL }}" defer></script>
</body>
</html>
