<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
<title id="title">Peel-trace interpretation workflow</title>
<desc id="desc">A conceptual workflow moving from a raw force displacement trace through quality control and window selection, to force and stability descriptors, replicate-level summaries, and interpretation with limitations.</desc>
<rect width="1400" height="500" fill="white"/>
<text x="700" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">From trace to interpretable summary</text>
<text x="700" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18">Original workflow schematic — no experimental data shown</text>
<g font-family="Arial, Helvetica, sans-serif">
  <rect x="45" y="160" rx="18" ry="18" width="220" height="120" fill="none" stroke="#222" stroke-width="2"/>
  <text x="155" y="205" text-anchor="middle" font-size="20" font-weight="700">Raw trace</text>
  <text x="155" y="238" text-anchor="middle" font-size="17">Force vs displacement</text>

  <line x1="265" y1="220" x2="345" y2="220" stroke="#222" stroke-width="2"/>
  <polygon points="345,220 331,211 331,229" fill="#222"/>

  <rect x="345" y="140" rx="18" ry="18" width="260" height="160" fill="none" stroke="#222" stroke-width="2"/>
  <text x="475" y="190" text-anchor="middle" font-size="20" font-weight="700">QC + valid window</text>
  <text x="475" y="225" text-anchor="middle" font-size="17">Check units, trace length,</text>
  <text x="475" y="250" text-anchor="middle" font-size="17">drift, extrema, break/drop</text>

  <line x1="605" y1="220" x2="685" y2="220" stroke="#222" stroke-width="2"/>
  <polygon points="685,220 671,211 671,229" fill="#222"/>

  <rect x="685" y="110" rx="18" ry="18" width="300" height="220" fill="none" stroke="#222" stroke-width="2"/>
  <text x="835" y="155" text-anchor="middle" font-size="20" font-weight="700">Protocol-defined descriptors</text>
  <line x1="835" y1="175" x2="835" y2="305" stroke="#777" stroke-width="1.5"/>
  <text x="760" y="205" text-anchor="middle" font-size="17" font-weight="700">Force level</text>
  <text x="760" y="235" text-anchor="middle" font-size="16">continuing force</text>
  <text x="760" y="262" text-anchor="middle" font-size="16">initiation / restart</text>
  <text x="910" y="205" text-anchor="middle" font-size="17" font-weight="700">Trace behavior</text>
  <text x="910" y="235" text-anchor="middle" font-size="16">stability / variation</text>
  <text x="910" y="262" text-anchor="middle" font-size="16">oscillation / stick-slip</text>

  <line x1="985" y1="220" x2="1065" y2="220" stroke="#222" stroke-width="2"/>
  <polygon points="1065,220 1051,211 1051,229" fill="#222"/>

  <rect x="1065" y="140" rx="18" ry="18" width="290" height="160" fill="none" stroke="#222" stroke-width="2"/>
  <text x="1210" y="185" text-anchor="middle" font-size="20" font-weight="700">Replicate summary</text>
  <text x="1210" y="220" text-anchor="middle" font-size="17">Mean / SD / CV +</text>
  <text x="1210" y="248" text-anchor="middle" font-size="17">quality flags</text>
</g>

<line x1="1210" y1="300" x2="1210" y2="350" stroke="#222" stroke-width="2"/>
<polygon points="1210,350 1201,336 1219,336" fill="#222"/>
<rect x="960" y="365" rx="16" ry="16" width="395" height="85" fill="none" stroke="#222" stroke-width="2"/>
<text x="1157" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Interpret within geometry and protocol</text>
<text x="1157" y="428" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16">state limits before generalizing</text>
</svg>